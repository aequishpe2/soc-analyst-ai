name: soc-analyst-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-soc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-soc}
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      STORAGE_DIR: /data/ingestion
    volumes:
      - ingestion_data:/data
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.17.6
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
    volumes:
      - ollama_data:/root/.ollama
    profiles: [ai]
volumes:
  postgres_data:
  ollama_data:
  ingestion_data:
